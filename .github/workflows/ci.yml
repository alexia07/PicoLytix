name: PicoLytix CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout Code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Install System Dependencies
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          git \
          clang-format \
          cppcheck \
          python3 \
          libusb-1.0-0-dev

    # 3. Install RISC-V Toolchain (For Pico 2 / RP2350)
    - name: Setup RISC-V Toolchain
      run: |
        echo "Installing RISC-V Toolchain for RP2350..."
        cd /tmp
        # Download the pre-built RISC-V toolchain for Linux
        wget https://github.com/raspberrypi/pico-sdk-tools/releases/download/v2.0.0-5/riscv-toolchain-14-aarch64-lin.tar.gz
        sudo mkdir -p /opt/riscv/riscv-toolchain-14
        sudo chown $USER /opt/riscv/riscv-toolchain-14
        tar xvf riscv-toolchain-14-aarch64-lin.tar.gz -C /opt/riscv/riscv-toolchain-14
        
        # Set environment variables
        export PICO_TOOLCHAIN_PATH=/opt/riscv/riscv-toolchain-14/
        export PICO_PLATFORM=rp2350-riscv

    # 4. Install Pico SDK
    - name: Setup Pico SDK
      run: |
        echo "Installing Pico SDK..."
        cd /tmp
        git clone https://github.com/raspberrypi/pico-sdk.git
        cd pico-sdk
        git checkout master
        git submodule update --init
        
        # Set environment variables
        export PICO_SDK_PATH="/tmp/pico-sdk"
        echo "PICO_SDK_PATH=$PICO_SDK_PATH" >> $GITHUB_ENV

    # 5. Install Picotool (Optional but good for UF2 validation)
    - name: Setup Picotool
      run: |
        cd /tmp
        git clone https://github.com/raspberrypi/picotool.git
        cd picotool
        mkdir build
        cd build
        cmake ..
        make
        sudo make install

    # 6. Make Scripts Executable (Safety Step)
    - name: Make Scripts Executable
      run: |
        cd tools/
        chmod +x format.sh static_analysis.sh

    # 7. Run Formatting Check (Using your script)
    - name: Check Code Formatting
      run: |
        echo "🎨 Running format.sh..."
        ./format.sh
        
        # Check if any files were modified by the formatter
        if ! git diff --quiet; then
          echo "❌ Formatting check failed! The following files were modified:"
          git diff
          echo "Please run './format.sh' locally and commit the changes."
          exit 1
        fi
        echo "✅ Formatting passed."

    # 8. Run Static Analysis (Using your script)
    - name: Run Static Analysis
      run: |
        echo "🔍 Running static_analysis.sh"
        ./static_analysis.sh
        echo "✅ Static analysis passed."

    # 8. Build Project
    - name: Build PicoLytix (RP2350)
      env:
        PICO_SDK_PATH: /tmp/pico-sdk
        PICO_TOOLCHAIN_PATH: /tmp/pico-riscv
      run: |
        echo "Building project for Pico 2..."
        mkdir -p build
        cd build
        
        # Configure with Pico 2 board and Release mode
        cmake ..
        
        # Build
        make -j$(nproc)
        
        # Verify UF2 exists
        if [ -f "PicoLytix.uf2" ]; then
          echo "✅ Build successful!"
          ls -lh PicoLytix.uf2
        else
          echo "❌ Build failed: UF2 not found."
          exit 1
        fi

    # 10. Upload Artifact
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: PicoLytix-RP2350
        path: build/PicoLytix.uf2
        retention-days: 7