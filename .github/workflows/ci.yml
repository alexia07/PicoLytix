name: PicoLytix CI Pipeline

on:
  push:
    branches:
    - "**"
  pull_request:
    branches:
    - "**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout Code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Setup Environment (Install Dependencies)
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          gcc-arm-none-eabi \
          libnewlib-arm-none-eabi \
          libstdc++-arm-none-eabi-newlib \
          clang-format \
          cppcheck \
          git \
          python3

    # 3. Install Pico SDK & Toolchain (RISC-V for Pico 2)
    - name: Setup Pico SDK (RP2350)
      run: |
        echo "Installing Pico SDK and RISC-V Toolchain..."
        # Clone the official setup script
        git clone https://github.com/raspberrypi/pico-setup.git pico-setup
        cd pico-setup
        # Run the setup script (installs SDK, toolchain, picotool to ~/.pico-sdk)
        # We use the non-interactive flags
        export PICO_SETUP_ROOT_DIR="$HOME/.pico-sdk"
        ./pico-setup/setup.sh
        
        # Verify installation
        echo "SDK Path: $PICO_SDK_PATH"
        riscv32-unknown-elf-gcc --version

    # 4. Check Formatting
    - name: Check Code Formatting
      run: |
        echo "Running clang-format check..."
        # Find all C/H files and check them
        # Exit with error if any file needs formatting
        find src -type f \( -name "*.c" -o -name "*.h" -o -name "*.cpp" -o -name "*.hpp" \) | xargs clang-format --dry-run --Werror --style=file
        
        if [ $? -ne 0 ]; then
          echo "❌ Formatting check failed! Please run 'clang-format -i' on your files."
          exit 1
        fi
        echo "✅ Formatting check passed."

    # 5. Static Analysis (Cppcheck)
    - name: Run Static Analysis (Cppcheck)
      run: |
        echo "Running cppcheck..."
        # Run cppcheck on src/
        # We suppress 'missingIncludeSystem' because we don't want it to fail on SDK headers
        cppcheck --enable=all \
                 --inconclusive \
                 --error-exitcode=1 \
                 --std=c11 \
                 --suppress=missingIncludeSystem \
                 --suppress=unusedFunction \
                 --suppress=constStatement \
                 -I src \
                 -I $HOME/.pico-sdk/sdk/2.3.0/src/common/pico_stdlib/include \
                 -I $HOME/.pico-sdk/sdk/2.3.0/src/common/hardware_regs/include \
                 -I $HOME/.pico-sdk/sdk/2.3.0/src/rp2_common/hardware_base/include \
                 src/
        
        if [ $? -ne 0 ]; then
          echo "❌ Static analysis failed! Please fix the issues above."
          exit 1
        fi
        echo "✅ Static analysis passed."

    # 6. Build Project
    - name: Build PicoLytix (RP2350)
      run: |
        echo "Configuring and building project..."
        mkdir -p build
        cd build
        
        # Configure CMake
        # Explicitly set PICO_BOARD to pico2
        cmake .. -DPICO_BOARD=pico2 -DCMAKE_BUILD_TYPE=Release
        
        # Build
        make -j$(nproc)
        
        # Verify outputs exist
        if [ -f "PicoLytix.uf2" ]; then
          echo "✅ Build successful! PicoLytix.uf2 generated."
          ls -lh PicoLytix.uf2
        else
          echo "❌ Build failed: PicoLytix.uf2 not found."
          exit 1
        fi

    # 7. Upload Artifact (Optional but Recommended)
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: PicoLytix-Build
        path: build/PicoLytix.uf2
        retention-days: 7