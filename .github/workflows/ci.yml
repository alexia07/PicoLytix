name: PicoLytix CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout Code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Install System Dependencies
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          git \
          clang-format \
          cppcheck \
          python3 \
          libusb-1.0-0-dev

    # 3. Make Scripts Executable (Safety Step)
    - name: Make Scripts Executable
      run: |
        cd tools/
        chmod +x format.sh static_analysis.sh

    # 4. Run Formatting Check (Using your script)
    - name: Check Code Formatting
      run: |
        echo "🎨 Running format.sh..."
        ./tools/format.sh
        
        # Check if any files were modified by the formatter
        if ! git diff --quiet; then
          echo "❌ Formatting check failed! The following files were modified:"
          git diff
          echo "Please run './tools/format.sh' locally and commit the changes."
          exit 1
        fi
        echo "✅ Formatting passed."

    # 5. Run Static Analysis (Using your script)
    - name: Run Static Analysis
      run: |
        echo "🔍 Running static_analysis.sh"
        ./tools/static_analysis.sh
        echo "✅ Static analysis passed."

    # 6. Install RISC-V Toolchain (For Pico 2 / RP2350)
    - name: Setup RISC-V Toolchain
      run: |
        echo "Installing RISC-V Toolchain for RP2350 (x86_64)..."
        cd /tmp
        
        # Download the official RISC-V toolchain for Linux x86_64
        # Source: https://github.com/raspberrypi/pico-setup/blob/master/download/fetch_riscv_toolchain.py
        # Direct link to the tarball used by the official setup script
        wget https://github.com/raspberrypi/pico-setup/raw/master/download/riscv-none-elf-gcc-12.2.1_2023.02-x86_64.tar.xz
        
        # Create directory
        mkdir -p /opt/riscv
        
        # Extract
        tar -xf riscv-none-elf-gcc-12.2.1_2023.02-x86_64.tar.xz -C /opt/riscv
        
        # The extraction creates a folder like 'riscv-none-elf-gcc-12.2.1_2023.02'
        # We need to find the exact path
        TOOLCHAIN_PATH=$(find /opt/riscv -type d -name "riscv-none-elf-gcc*" | head -n 1)
        
        if [ -z "$TOOLCHAIN_PATH" ]; then
          echo "❌ Error: Toolchain not found after extraction!"
          ls -R /opt/riscv
          exit 1
        fi
        
        echo "✅ Toolchain installed at: $TOOLCHAIN_PATH"
        
        # Verify compiler exists
        ls -l "$TOOLCHAIN_PATH/bin/riscv32-unknown-elf-gcc" || ls -l "$TOOLCHAIN_PATH/bin/riscv-none-elf-gcc"
        
        # Save to GITHUB_ENV
        echo "PICO_TOOLCHAIN_PATH=$TOOLCHAIN_PATH" >> $GITHUB_ENV
        echo "PICO_PLATFORM=rp2350-riscv" >> $GITHUB_ENV
        echo "PICO_COMPILER=pico_riscv_gcc" >> $GITHUB_ENV

    # 7. Install Pico SDK
    - name: Setup Pico SDK
      run: |
        echo "Installing Pico SDK..."
        cd ${HOME}
        git clone https://github.com/raspberrypi/pico-sdk.git
        mv pico-sdk .pico-sdk
        cd .pico-sdk
        git checkout master
        git submodule update --init
        
        # Set environment variables
        export PICO_SDK_PATH="${HOME}/.pico-sdk"
        echo "PICO_SDK_PATH=$PICO_SDK_PATH" >> $GITHUB_ENV

    # 8. Install Picotool (Optional but good for UF2 validation)
    - name: Setup Picotool
      run: |
        cd /tmp
        git clone https://github.com/raspberrypi/picotool.git
        cd picotool
        mkdir build
        cd build
        cmake ..
        make
        sudo make install

    # 9. Build Project (Explicitly RISC-V)
    - name: Build PicoLytix (RP2350 RISC-V)
      run: |
        echo "🔨 Starting Build for Raspberry Pi Pico 2 (RP2350 RISC-V)..."
        
        # Verify Environment Variables are set
        echo "PICO_SDK_PATH: $PICO_SDK_PATH"
        echo "PICO_TOOLCHAIN_PATH: $PICO_TOOLCHAIN_PATH"
        echo "PICO_PLATFORM: $PICO_PLATFORM"
        echo "PICO_COMPILER: $PICO_COMPILER"
        
        # Verify compiler is accessible
        $PICO_TOOLCHAIN_PATH/bin/riscv32-unknown-elf-gcc --version
        
        mkdir -p build
        cd build
        
        echo "Running CMake configuration..."
        cmake .. \
          -DPICO_BOARD=pico2 \
          -DPICO_PLATFORM=rp2350-riscv \
          -DPICO_COMPILER=pico_riscv_gcc \
          -DPICO_TOOLCHAIN_PATH=$PICO_TOOLCHAIN_PATH \
          -DCMAKE_BUILD_TYPE=Release
        
        echo "Compiling..."
        make -j$(nproc)
        
        if [ -f "PicoLytix.uf2" ]; then
          echo "✅ Build Successful!"
          ls -lh PicoLytix.uf2
          echo "🔍 Verifying binary architecture..."
          file PicoLytix.elf
        else
          echo "❌ Build Failed: UF2 not found."
          exit 1
        fi

    # 10. Upload Artifact
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: PicoLytix-RP2350
        path: build/PicoLytix.uf2
        retention-days: 7