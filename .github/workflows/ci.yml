name: PicoLytix CI Pipeline
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout Code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Install System Dependencies
    - name: Install Dependencies
      run: |
        git submodule update --init --recursive
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          git \
          clang-format \
          cppcheck \
          python3 \
          libusb-1.0-0-dev \
          wget \
          lcov

    # 3. Make Scripts Executable (Safety Step)
    - name: Make Scripts Executable
      run: |
        cd tools/
        chmod +x format.sh static_analysis.sh
        cd ../tests/
        chmod +x run_tests.sh

    # 4. Run Formatting Check (Using your script)
    - name: Check Code Formatting
      run: |
        echo "🎨 Running format.sh..."
        ./tools/format.sh
        echo "✅ Formatting passed."

    # 5. Run Static Analysis (Using your script)
    - name: Run Static Analysis
      run: |
        echo "🔍 Running static_analysis.sh"
        ./tools/static_analysis.sh
        echo "✅ Static analysis passed."

    # 6. Run Unit Tests
    - name: Run Unit Tests
      run: |
        echo "🧪 Running unit tests..."
        ./tests/run_tests.sh
        echo "✅ Unit tests passed."

    # 7. SonarCloud Analysis
    - name: SonarCloud
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    # 8. Install RISC-V Toolchain (For Pico 2 / RP2350)
    - name: Setup RISC-V Toolchain (Alternative)
      run: |
        echo "Installing XPACK RISC-V Toolchain..."
        cd /tmp
        
        # Download XPACK GNU RISC-V Embedded GCC (very stable)
        wget https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v14.2.0-1/xpack-riscv-none-elf-gcc-14.2.0-1-linux-x64.tar.gz
        
        mkdir -p /opt/riscv
        tar -xzf xpack-riscv-none-elf-gcc-14.2.0-1-linux-x64.tar.gz -C /opt/riscv
        
        # Find the folder (usually named xpack-riscv-none-elf-gcc-*)
        TOOLCHAIN_PATH=$(find /opt/riscv -type d -name "xpack-riscv-none-elf-gcc*" | head -n 1)
        
        echo "PICO_TOOLCHAIN_PATH=$TOOLCHAIN_PATH" >> $GITHUB_ENV
        echo "PICO_PLATFORM=rp2350-riscv" >> $GITHUB_ENV
        echo "PICO_COMPILER=pico_riscv_gcc" >> $GITHUB_ENV

    # 9. Install Pico SDK
    - name: Setup Pico SDK
      run: |
        echo "Installing Pico SDK..."
        cd ${HOME}
        git clone https://github.com/raspberrypi/pico-sdk.git
        mv pico-sdk .pico-sdk
        cd .pico-sdk
        git checkout 2.3.0
        git submodule update --init
        
        # Set environment variables
        export PICO_SDK_PATH="${HOME}/.pico-sdk"
        echo "PICO_SDK_PATH=$PICO_SDK_PATH" >> $GITHUB_ENV

    # 10. Install Picotool (Optional but good for UF2 validation)
    - name: Setup Picotool
      run: |
        cd /tmp
        git clone https://github.com/raspberrypi/picotool.git
        cd picotool
        mkdir build
        cd build
        cmake ..
        make
        sudo make install

    # 11. Build Project (Explicitly RISC-V)
    - name: Build PicoLytix (RP2350 RISC-V)
      run: |
        echo "🔨 Starting Build for Raspberry Pi Pico 2 (RP2350 RISC-V)..."
        
        # Verify Environment Variables
        echo "PICO_SDK_PATH: $PICO_SDK_PATH"
        echo "PICO_TOOLCHAIN_PATH: $PICO_TOOLCHAIN_PATH"
        echo "PICO_PLATFORM: $PICO_PLATFORM"
        echo "PICO_COMPILER: $PICO_COMPILER"
        
        # CRITICAL: Add the toolchain bin folder to the system PATH
        # This allows CMake to find 'riscv-none-elf-gcc' automatically
        export PATH="$PICO_TOOLCHAIN_PATH/bin:$PATH"
        
        # Verify which compiler is actually available
        echo "Available RISC-V compilers:"
        ls -l "$PICO_TOOLCHAIN_PATH/bin/" | grep riscv
        which riscv-none-elf-gcc || echo "riscv-none-elf-gcc not found in PATH"
        
        mkdir -p build
        cd build
        
        echo "Running CMake configuration..."
        cmake .. \
          -DPICO_BOARD=pico2 \
          -DPICO_PLATFORM=rp2350-riscv \
          -DPICO_COMPILER=pico_riscv_gcc \
          -DPICO_TOOLCHAIN_PATH=$PICO_TOOLCHAIN_PATH \
          -DCMAKE_BUILD_TYPE=Release
        
        echo "Compiling..."
        make -j$(nproc)
        
        if [ -f "PicoLytix.uf2" ]; then
          echo "✅ Build Successful!"
          ls -lh PicoLytix.uf2
          echo "🔍 Verifying binary architecture..."
          file PicoLytix.elf
        else
          echo "❌ Build Failed: UF2 not found."
          exit 1
        fi

    # 12. Upload Artifact
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: PicoLytix-RP2350
        path: build/PicoLytix.uf2
        retention-days: 7