name: PicoLytix CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout Code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Install System Dependencies
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          git \
          clang-format \
          cppcheck \
          python3 \
          libusb-1.0-0-dev

    # 3. Install RISC-V Toolchain (For Pico 2 / RP2350)
    - name: Setup RISC-V Toolchain
      run: |
        echo "Installing RISC-V Toolchain for RP2350..."
        cd /tmp
        # Download the pre-built RISC-V toolchain for Linux
        wget https://github.com/raspberrypi/pico-setup/raw/master/download/pico-setup-riscv.tar.gz
        mkdir -p pico-riscv
        tar -xzf pico-setup-riscv.tar.gz -C pico-riscv
        
        # Set environment variables
        export PICO_TOOLCHAIN_PATH="/tmp/pico-riscv"
        export PATH="$PICO_TOOLCHAIN_PATH/bin:$PATH"
        
        # Verify installation
        riscv32-unknown-elf-gcc --version
        echo "PICO_TOOLCHAIN_PATH=$PICO_TOOLCHAIN_PATH" >> $GITHUB_ENV

    # 4. Install Pico SDK
    - name: Setup Pico SDK
      run: |
        echo "Installing Pico SDK..."
        cd /tmp
        git clone https://github.com/raspberrypi/pico-sdk.git
        cd pico-sdk
        git checkout master
        git submodule update --init
        
        # Set environment variables
        export PICO_SDK_PATH="/tmp/pico-sdk"
        echo "PICO_SDK_PATH=$PICO_SDK_PATH" >> $GITHUB_ENV

    # 5. Install Picotool (Optional but good for UF2 validation)
    - name: Setup Picotool
      run: |
        cd /tmp
        git clone https://github.com/raspberrypi/picotool.git
        cd picotool
        mkdir build
        cd build
        cmake ..
        make
        sudo make install

    # 6. Check Code Formatting
    - name: Check Code Formatting
      run: |
        echo "Running clang-format check..."
        if ! find src -type f \( -name "*.c" -o -name "*.h" -o -name "*.cpp" -o -name "*.hpp" \) | xargs clang-format --dry-run --Werror --style=file; then
          echo "❌ Formatting check failed!"
          exit 1
        fi
        echo "✅ Formatting passed."

    # 7. Static Analysis (Cppcheck)
    - name: Run Static Analysis
      run: |
        echo "Running cppcheck..."
        # Define include paths for SDK
        SDK_INC="/tmp/pico-sdk/src/common/pico_stdlib/include"
        HW_INC="/tmp/pico-sdk/src/common/hardware_regs/include"
        
        if ! cppcheck --enable=all \
                 --inconclusive \
                 --error-exitcode=1 \
                 --std=c11 \
                 --suppress=missingIncludeSystem \
                 --suppress=unusedFunction \
                 -I src \
                 -I "$SDK_INC" \
                 -I "$HW_INC" \
                 src/; then
          echo "❌ Static analysis failed!"
          exit 1
        fi
        echo "✅ Static analysis passed."

    # 8. Build Project
    - name: Build PicoLytix (RP2350)
      env:
        PICO_SDK_PATH: /tmp/pico-sdk
        PICO_TOOLCHAIN_PATH: /tmp/pico-riscv
      run: |
        echo "Building project for Pico 2..."
        mkdir -p build
        cd build
        
        # Configure with Pico 2 board and Release mode
        cmake .. -DPICO_BOARD=pico2 -DCMAKE_BUILD_TYPE=Release
        
        # Build
        make -j$(nproc)
        
        # Verify UF2 exists
        if [ -f "PicoLytix.uf2" ]; then
          echo "✅ Build successful!"
          ls -lh PicoLytix.uf2
        else
          echo "❌ Build failed: UF2 not found."
          exit 1
        fi

    # 9. Upload Artifact
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: PicoLytix-RP2350
        path: build/PicoLytix.uf2
        retention-days: 7