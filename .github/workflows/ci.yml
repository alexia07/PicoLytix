name: PicoLytix CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout Code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Install System Dependencies
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          git \
          clang-format \
          cppcheck \
          python3 \
          libusb-1.0-0-dev

    # 3. Make Scripts Executable (Safety Step)
    - name: Make Scripts Executable
      run: |
        cd tools/
        chmod +x format.sh static_analysis.sh

    # 4. Run Formatting Check (Using your script)
    - name: Check Code Formatting
      run: |
        echo "🎨 Running format.sh..."
        ./tools/format.sh
        
        # Check if any files were modified by the formatter
        if ! git diff --quiet; then
          echo "❌ Formatting check failed! The following files were modified:"
          git diff
          echo "Please run './tools/format.sh' locally and commit the changes."
          exit 1
        fi
        echo "✅ Formatting passed."

    # 5. Run Static Analysis (Using your script)
    - name: Run Static Analysis
      run: |
        echo "🔍 Running static_analysis.sh"
        ./tools/static_analysis.sh
        echo "✅ Static analysis passed."

    # 6. Install RISC-V Toolchain (For Pico 2 / RP2350)
    - name: Setup RISC-V Toolchain
      run: |
        echo "Installing RISC-V Toolchain for RP2350..."
        cd /tmp
        # Download the pre-built RISC-V toolchain for Linux
        wget https://github.com/raspberrypi/pico-sdk-tools/releases/download/v2.0.0-5/riscv-toolchain-14-aarch64-lin.tar.gz
        sudo mkdir -p /opt/riscv/riscv-toolchain-14
        sudo chown $USER /opt/riscv/riscv-toolchain-14
        tar xvf riscv-toolchain-14-aarch64-lin.tar.gz -C /opt/riscv/riscv-toolchain-14
        
        # Set environment variables
        export PICO_TOOLCHAIN_PATH=/opt/riscv/riscv-toolchain-14/
        export PICO_PLATFORM=rp2350-riscv

    # 7. Install Pico SDK
    - name: Setup Pico SDK
      run: |
        echo "Installing Pico SDK..."
        cd ${HOME}
        git clone https://github.com/raspberrypi/pico-sdk.git
        mv pico-sdk .pico-sdk
        cd .pico-sdk
        git checkout master
        git submodule update --init
        
        # Set environment variables
        export PICO_SDK_PATH="${HOME}/.pico-sdk"
        echo "PICO_SDK_PATH=$PICO_SDK_PATH" >> $GITHUB_ENV

    # 8. Install Picotool (Optional but good for UF2 validation)
    - name: Setup Picotool
      run: |
        cd /tmp
        git clone https://github.com/raspberrypi/picotool.git
        cd picotool
        mkdir build
        cd build
        cmake ..
        make
        sudo make install

    # 9. Build Project (Explicitly RISC-V for RP2350)
    - name: Build PicoLytix (RP2350 RISC-V)
      # env:
      #   PICO_SDK_PATH: $HOME/.pico-sdk
      #   PICO_TOOLCHAIN_PATH: $HOME/.pico-sdk/tools/riscv32-unknown-elf-gcc/bin
      run: |
        echo "🔨 Starting Build for Raspberry Pi Pico 2 (RP2350)..."
        
        # 2. Verify Environment Variables
        echo "PICO_SDK_PATH: $PICO_SDK_PATH"
        echo "PICO_TOOLCHAIN_PATH: $PICO_TOOLCHAIN_PATH"
        
        # 3. Create Build Directory
        mkdir -p build
        cd build
        
        # 4. Configure CMake
        # -DPICO_BOARD=pico2: Forces RP2350 architecture
        # -DPICO_TOOLCHAIN_PATH: Forces the RISC-V compiler found in /tmp/pico-riscv
        echo "Running CMake configuration..."
        cmake .. \
          -DPICO_BOARD=pico2 \
          -DPICO_TOOLCHAIN_PATH=$PICO_TOOLCHAIN_PATH \
          -DCMAKE_BUILD_TYPE=Release
        
        # 5. Compile
        echo "Compiling..."
        make -j$(nproc)
        
        # 6. Verify Output
        if [ -f "PicoLytix.uf2" ]; then
          echo "✅ Build Successful!"
          echo "📦 Artifact: PicoLytix.uf2"
          ls -lh PicoLytix.uf2
          
          # Optional: Verify the binary architecture using 'file' command
          echo "🔍 Verifying binary architecture..."
          file PicoLytix.elf
        else
          echo "❌ Build Failed: PicoLytix.uf2 not found."
          exit 1
        fi

    # 10. Upload Artifact
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: PicoLytix-RP2350
        path: build/PicoLytix.uf2
        retention-days: 7